<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <!-- Login Section -->
  <div id="login-section">
    <h2>Login to Start Quiz</h2>
    <input type="text" id="username" placeholder="Enter Username" />
    <input type="password" id="password" placeholder="Enter Password" />
    <button onclick="login()">Login</button>
    <p id="login-error" class="error"></p>
  </div>

  <!-- Quiz Section -->
  <div id="quiz-section" class="hidden">
    <h2 id="welcome-user"></h2>
    <div id="quiz-box">
      <p id="question"></p>
      <ul>
        <li><button class="option-btn" onclick="selectAnswer(0)"></button></li>
        <li><button class="option-btn" onclick="selectAnswer(1)"></button></li>
        <li><button class="option-btn" onclick="selectAnswer(2)"></button></li>
        <li><button class="option-btn" onclick="selectAnswer(3)"></button></li>
      </ul>
      <button id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
    <div id="result" class="hidden">
      <h3>Your Score: <span id="score"></span></h3>
      <button onclick="restartQuiz()">Restart Quiz</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
